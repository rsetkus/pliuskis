AMAZON_IOT_ENDPOINT="some.endpoint.to.amazonaws.com"
KEYSTORE_NAME=keystore
KEYSTORE_PASSWORD=keystore_passwd
CERT_ID=iotcert
DEBUG_BROKER_HOST=10.0.2.2
# Cognito sign-in (dummy values: copy this file to the gitignored secrets.properties and fill in the real ones from
# the pliuskis-backend stacks' outputs). The release build reads COGNITO_*, from the prod stack. The debug build
# reads DEBUG_COGNITO_*, from the dev stack. The redirect URI's scheme also goes into the app's intent filter.
COGNITO_USER_POOL_ID=eu-north-1_EXAMPLE
COGNITO_APP_CLIENT_ID=exampleappclientid
COGNITO_LOGIN_DOMAIN=example.auth.eu-north-1.amazoncognito.com
COGNITO_REDIRECT_URI=lt.setkus.pliuskis://signin
DEBUG_COGNITO_USER_POOL_ID=eu-north-1_EXAMPLE
DEBUG_COGNITO_APP_CLIENT_ID=exampleappclientid
DEBUG_COGNITO_LOGIN_DOMAIN=example-dev.auth.eu-north-1.amazoncognito.com
DEBUG_COGNITO_REDIRECT_URI=lt.setkus.pliuskis://signin
# Read by the release MQTT connection over Cognito credentials (prod stack); AMAZON_IOT_ENDPOINT above is the
# AWS IoT endpoint. The debug build needs none of them: it uses the LAN broker.
COGNITO_IDENTITY_POOL_ID=eu-north-1:00000000-0000-0000-0000-000000000000
AWS_REGION=eu-north-1
