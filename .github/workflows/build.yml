name: Android Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 17 is the minimum for AGP 9.3 and Gradle 9.7 (see AGENTS.md)
      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: "temurin"

      # Caches the Gradle User Home. v5, not v6: v6 moves caching to a component under separate terms of use.
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Project
        run: ./gradlew assemble

      - name: Run Tests
        run: ./gradlew test

      - name: Verify Screenshots
        run: ./gradlew verifyPaparazziDebug

      - name: Upload Screenshot Diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-failures
          path: "**/build/paparazzi/failures/"
          if-no-files-found: ignore

      - name: Lint Checks
        run: ./gradlew detekt ktlintCheck lint

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            **/build/test-results/
            **/build/reports/
          if-no-files-found: ignore
