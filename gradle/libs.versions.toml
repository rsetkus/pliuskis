# SKIE hooks into the Kotlin/Native compiler, and each SKIE release supports only certain Kotlin versions. Upgrade
# SKIE together with Kotlin (`kotlin` above).
skie = "0.10.16"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
