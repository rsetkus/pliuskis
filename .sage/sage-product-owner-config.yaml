# ProductOwner instructions for pliuskis (Android app, Kotlin, Jetpack Compose, MQTT to IoT plant devices).
#
# The PO turns a Jira epic/issue or PRD.md into spec.md, epics/ and stories/.
# These instructions narrow the PO's defaults to fit this project's shape.

instructions:
  - "Read AGENTS.md first: module layout (app, core/domain, core/data, core/designsystem, feature/*, build-logic), build commands, CI and repo rules."
  - "Source of requirements: when the user names a Jira issue or epic (PLIUS-N or a Jira URL), fetch it and every child issue with the Atlassian tools and treat them as the requirements; quote their acceptance criteria rather than re-inventing them. Otherwise read PRD.md. If neither exists, ask the User."
  - "For a Jira epic, write one story per child task, keep the Jira key in the story's notes field (e.g. notes: \"Jira PLIUS-9\"), and mirror the Jira 'blocks' links as story dependencies. One Jira epic = one sage epic unless the epic is genuinely split into independent deliverables."
  - "PRD.md describes the v0.1 MVP. Honor its Non-goals for product features (no design system, assets, i18n, configuration files, analytics); anything that smells like v0.2 goes into a 'Future considerations' subsection of the spec, not into a story. Build, test and infrastructure work (toolchain, libraries, CI) is not limited by those non-goals."
  - "Before scoping a story that touches an existing flow, read its doc in docs/features/ (e.g. device-discovery.md). The MQTT topics and payloads are a contract with the Pico firmware (rsetkus/pico-pliuskis): any story that changes a topic or payload must say so in Technical Notes, because the firmware needs the same change."
  - "Acceptance criteria must be observable and testable with the project's stack (docs/testing.md): Kotest FunSpec unit tests on the JVM, Paparazzi screenshot tests, or Compose UI behaviour tests. Phrase them as 'given X, the system produces Y' with literal values (JSON payloads, topic strings, UI state), never 'works correctly'."
  - "Build or tooling AC may be phrased as a Gradle command outcome (e.g. './gradlew assemble test verifyPaparazziDebug detekt ktlintCheck lint exits 0', './gradlew connectedCheck exits 0 on the API 29 emulator'). Use version floors (>= X), not exact versions, so AC don't go stale."
  - "Mark any AC that cannot be automated as '(manual check)' and say where its evidence goes (the story's implementation map). Known manual checks: launching the release build needs secrets.properties and core/data/src/main/assets/legacy-keystore.p12 (gitignored); MQTT behaviour can be checked against the staging broker and simulated devices in staging/ (see staging/README.md) on the emulator; a physical phone or the real Pico needs the User."
  - "AC must not require git writes (commits, branches, PRs): agents may not commit without the User's request. Write 'changed Paparazzi goldens are listed with a reason for review', not 'goldens are in a separate commit'."
  - "Scope stories so each one leaves the build green on its own (CI runs per push). If a later story is likely to change lines an earlier story's AC cite, say so in Technical Notes."
  - "Reference docs/conventions.md (single return, no !!, naming) and docs/testing.md (Story<N> test naming, story-scoped commands) when scoping stories. A story whose AC can't fit those conventions is a spec problem to escalate to the User, not a story to write."
