// The version name of both apps, defined only here: Android's versionName (app/build.gradle.kts) and iOS's
// MARKETING_VERSION, which the build writes to CFBundleShortVersionString (iosApp/Configuration/Base.xcconfig includes
// this file). Gradle reads it as a properties file and Xcode as an xcconfig file, so keep every setting in the form
// KEY = value and every comment on a line that starts with //.
VERSION_NAME = 0.1
